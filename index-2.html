<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSS 202 CBT Practice - Inferential Statistics</title>
<style>
:root{--g:#0b5d2a;--g2:#084a21;--gold:#c9a227;--bg:#eef1ee;--red:#b3261e;--ok:#1b7a3a}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:#1c1c1c}
header{background:var(--g);color:#fff;text-align:center;padding:12px 10px;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:1.15rem;letter-spacing:.5px}
header p{margin:3px 0 0;font-size:.85rem;opacity:.9}
.wrap{max-width:1000px;margin:18px auto;padding:0 12px}
.card{background:#fff;border:1px solid #cfd6cf;border-radius:6px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hide{display:none!important}
label{display:block;font-weight:600;margin:14px 0 5px;font-size:.9rem}
input[type=text]{width:100%;padding:11px;border:1px solid #98a398;border-radius:4px;font-size:1rem}
button{cursor:pointer;border:0;border-radius:4px;padding:11px 20px;font-size:.95rem;font-weight:600}
.btn{background:var(--g);color:#fff}.btn:hover{background:var(--g2)}
.btn2{background:#e3e7e3;color:#222}.btn2:hover{background:#d3d8d3}
.btnr{background:var(--red);color:#fff}
.err{color:var(--red);font-size:.85rem;margin-top:8px;min-height:1em}
ul.rules{padding-left:20px;font-size:.9rem;line-height:1.6}
.top{position:sticky;top:0;z-index:5;background:#fff;border:1px solid #cfd6cf;border-radius:6px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.timer{font-size:1.4rem;font-weight:700;font-family:Consolas,monospace;color:var(--g)}
.timer.low{color:var(--red);animation:b 1s infinite}
@keyframes b{50%{opacity:.4}}
.grid{display:grid;grid-template-columns:1fr 250px;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.qn{font-weight:700;color:var(--g);margin-bottom:8px}
.qt{font-size:1.08rem;line-height:1.5;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #c5ccc5;border-radius:5px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:hover{background:#f3f7f3}
.opt.sel{background:#e2f1e6;border-color:var(--g)}
.opt b{min-width:20px}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.pal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pal button{padding:8px 0;background:#e3e7e3;color:#222;font-size:.8rem}
.pal button.ans{background:var(--g);color:#fff}
.pal button.cur{outline:3px solid var(--gold)}
.leg{font-size:.78rem;margin-top:10px;color:#444}
.res{text-align:center}
